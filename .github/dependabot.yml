version: 2
updates:
  # The plugin has no npm dependencies; only the actions used by ci / release need watching.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: sunday
      time: "20:00"
      timezone: Europe/Lisbon
    # Only surface releases that have been public for at least 7 days.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
      include: scope
