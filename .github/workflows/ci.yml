name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # herdr ships for linux and macos (herdr-plugin.toml `platforms`); package.json declares node >= 22.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        node: [22, 24]
        include:
          - os: macos-latest
            node: 24
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: ${{ matrix.node }}

      # The bins run only under herdr, so nothing imports them in tests; a syntax check catches
      # what the unit tests can't reach.
      - name: syntax check
        run: for f in bin/*.js lib/*.js scripts/*.js; do node --check "$f"; done

      - run: npm test

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # shellcheck is preinstalled on ubuntu runners.
      - name: shellcheck launcher
        run: shellcheck bin/herdr-gh

      # herdr reads the manifest version, npm the package.json one; cz bumps both together.
      - name: versions agree
        run: |
          manifest=$(sed -n 's/^version = "\(.*\)"$/\1/p' herdr-plugin.toml)
          pkg=$(node -p 'require("./package.json").version')
          cz=$(sed -n 's/^  version: //p' .cz.yaml)
          echo "herdr-plugin.toml=$manifest package.json=$pkg .cz.yaml=$cz"
          [ "$manifest" = "$pkg" ] && [ "$pkg" = "$cz" ]

  commits:
    # Conventional-commit check via commitizen, same ruleset as the release bump
    # (cz_conventional_commits). PR-only: on main the commits are already merged.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - run: pip install commitizen
      - name: check conventional commits
        run: cz check --rev-range ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}
